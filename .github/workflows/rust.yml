name: Rust

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build. Leave blank to build the branch selected above.
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or SHA to build. Leave blank to build the caller ref.
        required: false
        type: string
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  plugin:
    name: Plugin NRO
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        name: Rust Cache
        with:
          prefix-key: "plugin"
          cache-all-crates: true
      - name: Host-test shared crate
        # smush_info_shared is a path dep, not a workspace member — run from its directory.
        working-directory: smush_info_shared
        run: cargo test --lib
      - name: Install Skyline
        run: |
          cargo install cargo-skyline
          cargo-skyline skyline update-std
      - name: Build release NRO
        id: build_release
        run: RUSTFLAGS=-g cargo-skyline skyline build --release
      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsmush_info-nro
          path: target/aarch64-skyline-switch/release/libsmush_info.nro
          if-no-files-found: error
      - name: Package SD zip
        run: bash scripts/package-sd.sh
      - name: Name SD zip artifact
        id: artifact
        env:
          BUILD_REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
        run: |
          safe=$(printf '%s' "$BUILD_REF" | sed 's#[/:"<>|*?\\]#-#g')
          echo "name=smush_info-sd-${safe}" >> "$GITHUB_OUTPUT"
      - name: Upload SD zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: smush_info-sd.zip
      - name: Choose release upload
        id: release
        # Master builds refresh the standing "master" release, including a manual
        # run or a called workflow. Other refs only keep the Actions artifacts.
        # Compare the checkout ref in the shell: on push, inputs.ref is null, and
        # `null == ''` is false in an Actions if expression.
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          case "$BUILD_REF" in
            master|refs/heads/master)
              echo "upload=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "upload=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Upload SD zip to GitHub Release
        if: steps.release.outputs.upload == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: smush_info-sd.zip
          tag: master
          overwrite: true
