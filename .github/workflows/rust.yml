name: Rust

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build. Leave blank to build the branch selected above.
        required: false
        type: string
      release_tag:
        description: Existing GitHub Release tag to attach smush_info-sd.zip to. Leave blank to skip.
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or SHA to build. Leave blank to build the caller ref.
        required: false
        type: string
      release_tag:
        description: Existing GitHub Release tag to attach smush_info-sd.zip to. Leave blank to skip.
        required: false
        type: string
        default: ""
  push:
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  plugin:
    name: Plugin NRO
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        name: Rust Cache
        with:
          prefix-key: "plugin"
          cache-all-crates: true
      - name: Host-test shared crate
        # smush_info_shared is a path dep, not a workspace member — run from its directory.
        working-directory: smush_info_shared
        run: cargo test --lib
      - name: Install Skyline
        run: |
          cargo install cargo-skyline
          cargo-skyline skyline update-std
      - name: Build release NRO
        id: build_release
        run: RUSTFLAGS=-g cargo-skyline skyline build --release
      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsmush_info-nro
          path: target/aarch64-skyline-switch/release/libsmush_info.nro
          if-no-files-found: error
      - name: Package SD zip
        run: bash scripts/package-sd.sh
      - name: Name SD zip artifact
        id: artifact
        env:
          BUILD_REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
        run: |
          safe=$(printf '%s' "$BUILD_REF" | sed 's#[/:"<>|*?\\]#-#g')
          echo "name=smush_info-sd-${safe}" >> "$GITHUB_OUTPUT"
      - name: Upload SD zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: smush_info-sd.zip
      - name: Upload SD zip to GitHub Release
        # Push to master refreshes the standing "master" release. A called workflow
        # keeps the caller's event name, so workflow_call is never "release" here;
        # pass release_tag to attach the zip to some other existing release.
        # inputs.release_tag alone is not a condition: on push it is null, and
        # `null != ''` is true, which would upload every branch onto master.
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          github.event_name == 'release' ||
          inputs.release_tag
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: smush_info-sd.zip
          tag: ${{ inputs.release_tag || github.event.release.tag_name || 'master' }}
          overwrite: true
