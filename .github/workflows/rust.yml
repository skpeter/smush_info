name: Rust

on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  plugin:
    name: Plugin NRO
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        name: Rust Cache
        with:
          prefix-key: "plugin"
          cache-all-crates: true
      - name: Install Skyline
        run: |
          cargo install cargo-skyline
          cargo-skyline skyline update-std
      - name: Build release NRO
        id: build_release
        run: RUSTFLAGS=-g cargo-skyline skyline build --release
      - name: Package SD zip
        run: bash scripts/package-sd.sh
      - name: Upload SD zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: smush_info-sd
          path: smush_info-sd.zip
      - name: Upload SD zip to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: smush_info-sd.zip
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
